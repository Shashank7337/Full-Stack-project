<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background: #0f172a; color: white; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #6366f1; border: none; font-weight: bold; cursor: pointer; }
        .stats { display: flex; gap: 20px; }
        .stat-box { flex: 1; padding: 20px; background: #6366f1; border-radius: 12px; text-align: center; }
        ul { list-style: none; padding: 0; }
        li { background: #334155; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <h1>🚀 Project Management Dashboard</h1>
    <div class="stats card">
        <div class="stat-box"><h3>Total Tasks</h3><p id="total">0</p></div>
        <div class="stat-box"><h3>Pending</h3><p id="pending">0</p></div>
        <div class="stat-box"><h3>Completed</h3><p id="completed">0</p></div>
    </div>
    <div class="card">
        <h3>Create New Task (Admin)</h3>
        <input type="text" id="task-title" placeholder="Task Title">
        <select id="task-status">
            <option value="TODO">To Do</option>
            <option value="DONE">Done</option>
        </select>
        <button onclick="createTask()">Add Task</button>
    </div>
    <div class="card">
        <h3>Task List</h3>
        <ul id="task-list"></ul>
    </div>
    <script>
        const API_URL = window.location.origin;
        async function fetchDashboard() {
            const res = await fetch(`${API_URL}/dashboard-stats`);
            const data = await res.json();
            document.getElementById('total').innerText = data.total || 0;
            document.getElementById('pending').innerText = data.pending || 0;
            document.getElementById('completed').innerText = data.completed || 0;
            const taskRes = await fetch(`${API_URL}/tasks`);
            const tasks = await taskRes.json();
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach(t => {
                list.innerHTML += `<li>${t.title} <span>${t.status}</span></li>`;
            });
        }
        async function createTask() {
            const title = document.getElementById('task-title').value;
            const status = document.getElementById('task-status').value;
            await fetch(`${API_URL}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, status, admin_email: 'shashank@test.com' })
            });
            alert('Task Created!');
            fetchDashboard();
        }
        fetchDashboard();
    </script>
</body>
</html>
