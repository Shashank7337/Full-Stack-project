<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure PM Tool | 22BCD17076</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; }
        .hidden { display: none; }
        .container { padding: 30px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select, button { padding: 12px; margin: 5px 0; width: 100%; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #6366f1; font-weight: bold; cursor: pointer; border: none; }
        .task-item { display: flex; justify-content: space-between; background: #334155; padding: 10px; margin-top: 5px; border-radius: 5px; }
        .btn-status { width: auto; padding: 5px 10px; font-size: 12px; }
        .auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
    <div class="card" style="width: 350px; text-align: center;">
        <h2 id="auth-title">Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <select id="role" class="hidden">
            <option value="MEMBER">Team Member</option>
            <option value="ADMIN">Admin</option>
        </select>
        <button onclick="handleAuth()" id="auth-btn">Sign In</button>
        <p onclick="toggleAuth()" style="cursor:pointer; font-size: 12px; margin-top: 10px;" id="toggle-text">New user? Register here</p>
    </div>
</div>

<div id="dashboard" class="container hidden">
    <h1>🚀 Project Dashboard</h1>
    <div class="card" id="admin-zone">
        <h3>➕ Create Task</h3>
        <input type="text" id="task-title" placeholder="Task details...">
        <button onclick="createTask()">Create & Assign</button>
    </div>
    <div class="card">
        <h3>📋 Task List (Click to Update)</h3>
        <div id="task-list"></div>
    </div>
</div>

<script>
    const API = window.location.origin;
    let user = null;
    let isLogin = true;

    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? 'Login' : 'Register';
        document.getElementById('auth-btn').innerText = isLogin ? 'Sign In' : 'Sign Up';
        document.getElementById('toggle-text').innerText = isLogin ? 'New user? Register here' : 'Back to Login';
        document.getElementById('role').classList.toggle('hidden');
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('pass').value;
        const role = document.getElementById('role').value;
        const path = isLogin ? '/login' : '/signup';
        
        const res = await fetch(API + path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password, role })
        });
        
        if(res.ok) {
            user = await res.json();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            if(user.role !== 'ADMIN') document.getElementById('admin-zone').classList.add('hidden');
            loadTasks();
        } else {
            alert("Auth Failed!");
        }
    }

    async function loadTasks() {
        const res = await fetch(API + '/tasks');
        const tasks = await res.json();
        document.getElementById('task-list').innerHTML = tasks.map(t => `
            <div class="task-item">
                <span>${t.title} [${t.status}]</span>
                <button class="btn-status" onclick="updateStatus(${t.id}, '${t.status === 'TODO' ? 'DONE' : 'TODO'}')">
                    Mark as ${t.status === 'TODO' ? 'Done' : 'Pending'}
                </button>
            </div>
        `).join('');
    }

    async function updateStatus(id, newStatus) {
        await fetch(`${API}/tasks/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ status: newStatus })
        });
        loadTasks();
    }

    async function createTask() {
        const title = document.getElementById('task-title').value;
        await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title, status: 'TODO', admin_email: user.email })
        });
        document.getElementById('task-title').value = '';
        loadTasks();
    }
</script>
</body>
</html>
